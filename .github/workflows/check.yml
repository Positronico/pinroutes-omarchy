name: check
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Shell syntax
        run: |
          bash -n helper/pinroutes-helper
          bash -n helper/pinroutes-helper-install

      - name: Python syntax
        run: python3 -m py_compile stateio.py

      - name: Privileged components carry their own whole-invocation deadline
        run: |
          grep -Eq '^ *exec timeout -k 5 60 "\$0"' helper/pinroutes-helper
          grep -Eq '^ *exec timeout -k 5 60 "\$0"' helper/pinroutes-helper-install

      - name: Embedded helper matches helper/pinroutes-helper
        run: |
          sed -n '/^cat >"\$helper_tmp" <<.EMBEDDED_HELPER.$/,/^EMBEDDED_HELPER$/p' \
            helper/pinroutes-helper-install | sed '1d;$d' \
            | diff - helper/pinroutes-helper

      - name: Manifest is valid JSON with required fields
        run: |
          jq -e '.schemaVersion == 1 and .id == "pinroutes" and (.version | type) == "string"
                 and (.kinds | length) > 0 and (.entryPoints | type) == "object"' manifest.json

      - name: State I/O hardening
        run: |
          set -u
          # NB: a bare `! cmd` mid-step asserts nothing under bash -e
          # (errexit exempts !-pipelines); refute() fails the step for real.
          refute() { if "$@" >/dev/null 2>&1; then echo "FAIL(unexpectedly succeeded): $*"; exit 1; fi; }
          S=$PWD/stateio.py
          cd "$(mktemp -d)"
          mkdir -p cfg
          echo '{"ok":true}' | python3 "$S" write cfg/state.json
          [ "$(python3 "$S" read cfg/state.json)" = '{"ok":true}' ]
          ln -s /etc/hostname cfg/link.json
          refute python3 "$S" read cfg/link.json
          mkfifo cfg/fifo.json
          timeout 3 python3 "$S" read cfg/fifo.json 2>/dev/null && exit 1 || [ $? -ne 124 ]
          touch cfg/a.json && ln cfg/a.json cfg/hard.json
          refute python3 "$S" read cfg/hard.json
          head -c 1048577 /dev/zero | python3 "$S" write cfg/state.json 2>/dev/null && exit 1
          [ "$(python3 "$S" read cfg/state.json)" = '{"ok":true}' ]  # over-limit write left old content intact
          head -c 1048577 /dev/zero > cfg/big.json
          refute python3 "$S" read cfg/big.json  # oversized file refused, not truncated
          echo "stateio OK"

      - name: Bootstrap, allowlist enforcement, fixed-component re-approve
        # Denial paths only ever run — they are refused before ip(8)
        # executes, so the runner's routing table is never touched.
        run: |
          set -u
          expect() { # expect <code> <cmd...>
            local want=$1 rc=0; shift
            "$@" 2>/dev/null || rc=$?
            [ "$rc" -eq "$want" ] || { echo "FAIL($rc!=$want): $*"; exit 1; }
          }
          # `! cmd` mid-step asserts nothing under bash -e; refute() does.
          refute() { if "$@" >/dev/null 2>&1; then echo "FAIL(unexpectedly succeeded): $*"; exit 1; fi; }
          bootstrap() { sudo /bin/bash -c "$(cat helper/pinroutes-helper-install)" pinroutes-approve "$@"; }
          # Direct root execution of the (user-owned) checkout file is refused
          expect 2 sudo ./helper/pinroutes-helper-install --approve 10.0.0.0/24 10.0.0.1
          # Refusal: a foreign file at a managed path must block install
          echo junk | sudo tee /usr/local/bin/pinroutes-helper >/dev/null
          expect 2 bootstrap --approve 10.0.0.0/24 10.0.0.1
          expect 2 bootstrap --uninstall
          sudo rm /usr/local/bin/pinroutes-helper
          # Bootstrap exactly as documented: the user's shell captures the
          # script text; root receives only memory, never the checkout path.
          bootstrap --approve 10.0.0.0/24 10.0.0.1
          test -x /usr/local/bin/pinroutes-helper
          test -x /usr/local/bin/pinroutes-approve
          diff /usr/local/bin/pinroutes-approve helper/pinroutes-helper-install
          grep -qxF '10.0.0.0/24 10.0.0.1' /etc/pinroutes/routes.allow
          sudo grep -q 'secure_path' /etc/sudoers.d/pinroutes
          sudo grep -q 'managed-by: pinroutes' /etc/sudoers.d/pinroutes
          sudo grep -Eq '^#[0-9]+ ALL=\(root\) NOSETENV: NOPASSWD:' /etc/sudoers.d/pinroutes
          sudo grep -q 'env_delete += "BASH_ENV ENV SHELLOPTS BASHOPTS PS4 PINROUTES_DEADLINE"' /etc/sudoers.d/pinroutes
          sudo grep -q 'env_keep -= "BASH_ENV' /etc/sudoers.d/pinroutes
          # NOSETENV behavior: a caller BASH_ENV must never execute in the
          # root shell. (A `sudo -E` refusal test is not meaningful here —
          # the runner's own blanket sudoers rule also matches and permits
          # -E, so only the per-command env stripping can be asserted.)
          echo 'touch /tmp/pinroutes-canary-executed' > /tmp/pinroutes-canary.sh
          BASH_ENV=/tmp/pinroutes-canary.sh sudo -n /usr/local/bin/pinroutes-helper delete 10.0.0.0/24 10.0.0.1
          test ! -e /tmp/pinroutes-canary-executed
          sudo visudo -cf /etc/sudoers.d/pinroutes
          sudo test ! -e /etc/pinroutes/.pinroutes-txn  # journal committed away
          # No staging leftovers
          refute ls /usr/local/bin/.pinroutes-stage.*
          # Self-installed approver is runnable and re-approves on its own
          # (update-in-place exercises the backup/publish path)
          sudo /usr/local/bin/pinroutes-approve --approve 10.9.0.0/24 10.9.0.1
          grep -qxF '10.9.0.0/24 10.9.0.1' /etc/pinroutes/routes.allow
          refute grep -q '10.0.0.0/24' /etc/pinroutes/routes.allow
          for d in /usr/local/bin /etc/pinroutes /etc/sudoers.d; do
            refute ls "$d"/.*.pinroutes-prev.*
            refute ls "$d"/.pinroutes-stage.*
          done
          # Enforcement: unapproved routes denied before ip runs
          h=/usr/local/bin/pinroutes-helper
          expect 3 sudo "$h" replace 0.0.0.0/0 9.9.9.9
          expect 3 sudo "$h" replace 0.0.0.0/1 9.9.9.9
          expect 3 sudo "$h" replace 10.9.0.0/24 6.6.6.6
          expect 3 sudo "$h" delete 192.168.0.0/16 1.2.3.4
          expect 3 sudo "$h" delete 10.9.0.0/24 6.6.6.6  # approved net, wrong gateway
          # sudo path without allowlist fails closed
          sudo rm /etc/pinroutes/routes.allow
          expect 3 sudo "$h" replace 10.9.0.0/24 10.9.0.1
          # syntax validation independent of policy
          expect 2 sudo "$h" replace "10.0.0.0/16;x" 10.0.0.1
          # uninstall removes everything
          sudo /usr/local/bin/pinroutes-approve --uninstall
          test ! -e /usr/local/bin/pinroutes-helper
          test ! -e /usr/local/bin/pinroutes-approve
          test ! -e /etc/sudoers.d/pinroutes
          echo "privileged flow OK"

      - name: Signal-injection at publication boundaries
        # Extracts the installer's transaction functions VERBATIM and drives
        # a real 4-target publication in a scratch tree, delivering one
        # SIGTERM deterministically at every boundary: before/after each live
        # rename (including the commit-marker rename) and before/after the
        # revoke rm. Invariant: whenever no journal file remains, all four
        # targets are byte-exactly old or byte-exactly new - never mixed,
        # never partial - and a new grant never sits over old components.
        # Every kill case must also prove the driver actually died (rc=143),
        # so the matrix can never go vacuous silently.
        run: |
          set -u
          # Static ordering proof: obligations recorded before the mutation
          grep -A7 '^publish() {' helper/pinroutes-helper-install | grep -B1 'mv -fT' | head -1 | grep -q 'published+='
          grep -B3 'rm -f -- "\$SUDOERS" || die "could not revoke' helper/pinroutes-helper-install | grep -q 'published+='
          [ "$(grep -c '^# BEGIN-TXN-FUNCTIONS' helper/pinroutes-helper-install)" = 1 ]
          [ "$(grep -c '^# END-TXN-FUNCTIONS' helper/pinroutes-helper-install)" = 1 ]
          sed -n '/# BEGIN-TXN-FUNCTIONS/,/# END-TXN-FUNCTIONS/p' helper/pinroutes-helper-install > /tmp/txn.sh
          grep -q '^publish()' /tmp/txn.sh && grep -q '^rollback()' /tmp/txn.sh && grep -q "trap 'cleanup" /tmp/txn.sh
          cat > /tmp/driver.sh <<'DRIVER'
          set -euo pipefail
          T=$1; MODE=$2; N=$3
          SUDOERS=$T/sudoers.d/pinroutes; ALLOW_DIR=$T/pinroutes; ALLOW=$ALLOW_DIR/routes.allow
          JOURNAL=$ALLOW_DIR/.pinroutes-txn; JOURNAL_DONE=$JOURNAL.committed
          HELPER_DEST=$T/bin/helper; APPROVE_DEST=$T/bin/approve
          txn_pending() { [[ -e $JOURNAL || -L $JOURNAL || -e $JOURNAL_DONE || -L $JOURNAL_DONE ]]; }
          sha_of() { sha256sum -- "$1" 2>/dev/null | cut -d" " -f1; }
          die() { echo "die: $*" >&2; exit 2; }
          sync() { :; } # durability is asserted structurally, not by this test
          MV_N=0; RM_N=0; FIRED=0
          fire() { FIRED=1; kill -TERM $$; builtin read -t 5 || true; }
          mv() { if [[ $FIRED == 0 && $MODE == beforemv && $((MV_N+1)) -eq $N ]]; then fire; fi
                 command mv "$@"; MV_N=$((MV_N+1))
                 if [[ $FIRED == 0 && $MODE == aftermv && $MV_N -eq $N ]]; then fire; fi
                 return 0; }
          rm() { if [[ $FIRED == 0 && $MODE == beforerm && $((RM_N+1)) -eq $N ]]; then fire; fi
                 command rm "$@"; RM_N=$((RM_N+1))
                 if [[ $FIRED == 0 && $MODE == afterrm && $RM_N -eq $N ]]; then fire; fi
                 return 0; }
          source /tmp/txn.sh
          sha() { sha256sum "$1" | cut -d" " -f1; }
          for t in "$HELPER_DEST" "$APPROVE_DEST" "$ALLOW" "$SUDOERS"; do backup_target "$t"; done
          for t in "$HELPER_DEST" "$APPROVE_DEST" "$ALLOW" "$SUDOERS"; do
            b="$(dirname "$t")/.$(basename "$t").pinroutes-prev.$$"
            printf '%s|%s|%s|%s\n' "$t" "$b" "$(sha "$b")" "$(sha "$t.new")"
          done > "$JOURNAL"
          published+=("$SUDOERS"); rm -f -- "$SUDOERS"
          publish "$HELPER_DEST.new" "$HELPER_DEST"
          publish "$APPROVE_DEST.new" "$APPROVE_DEST"
          publish "$ALLOW.new" "$ALLOW"
          publish "$SUDOERS.new" "$SUDOERS"
          mv -fT -- "$JOURNAL" "$JOURNAL_DONE"
          failed=0
          for entry in "${backups[@]}"; do command rm -f -- "${entry%%|*}"; done
          backups=(); command rm -f -- "$JOURNAL_DONE"
          DRIVER
          declare -A OLDSHA NEWSHA
          seed() { local T=$1 t
            mkdir -p "$T/bin" "$T/pinroutes" "$T/sudoers.d"
            for t in bin/helper bin/approve pinroutes/routes.allow sudoers.d/pinroutes; do
              printf 'OLD-%s\n' "$t" > "$T/$t"; printf 'NEW-%s\n' "$t" > "$T/$t.new"
              OLDSHA[$t]=$(sha256sum "$T/$t" | cut -d" " -f1)
              NEWSHA[$t]=$(sha256sum "$T/$t.new" | cut -d" " -f1)
            done; }
          run_case() { # run_case <mode> <n> <expect-kill:1|0>
            local T rc=0; T=$(mktemp -d); seed "$T"
            bash /tmp/driver.sh "$T" "$1" "$2" >/dev/null 2>&1 || rc=$?
            # Exact-code assertions keep the matrix from ever going vacuous:
            # kill cases must die of SIGTERM (143), the unkilled control must
            # complete cleanly - anything else (127 shim breakage, 2 die) is
            # a harness fault, not coverage.
            if [ "$3" = 1 ] && [ "$rc" -ne 143 ]; then echo "FAIL($1 $2): expected SIGTERM death, rc=$rc"; exit 1; fi
            if [ "$3" = 0 ] && [ "$rc" -ne 0 ]; then echo "FAIL($1 $2): control run failed, rc=$rc"; exit 1; fi
            local t old=0 new=0 other=0 cur
            for t in bin/helper bin/approve pinroutes/routes.allow sudoers.d/pinroutes; do
              if [ -e "$T/$t" ]; then cur=$(sha256sum "$T/$t" | cut -d" " -f1); else cur=ABSENT; fi
              if [ "$cur" = "${OLDSHA[$t]}" ]; then old=$((old+1))
              elif [ "$cur" = "${NEWSHA[$t]}" ]; then new=$((new+1))
              else other=$((other+1)); fi
            done
            local j=0
            if [ -e "$T/pinroutes/.pinroutes-txn" ] || [ -e "$T/pinroutes/.pinroutes-txn.committed" ]; then j=1; fi
            if [ "$j" -eq 0 ]; then
              if [ "$other" -ne 0 ] || { [ "$old" -ne 4 ] && [ "$new" -ne 4 ]; }; then
                echo "FAIL($1 $2): journal released but state not all-old/all-new (old=$old new=$new other=$other)"; exit 1
              fi
            fi
            command rm -rf "$T"; echo "ok: $1 $2 rc=$rc"
          }
          for n in 1 2 3 4 5; do run_case beforemv "$n" 1; run_case aftermv "$n" 1; done
          run_case beforerm 1 1; run_case afterrm 1 1
          run_case none 0 0   # unkilled control: full commit, all-new, no journal
          echo "signal injection OK"

      - name: Digest-verified crash recovery matrix
        # Simulates the persistence outcomes crashes/failed barriers can leave
        # behind (resurrected journal / committed marker / partially persisted
        # backup deletions / malformed journals) by crafting exact on-disk
        # states; recovery must prove all-old, all-new, or refuse-and-retain.
        run: |
          set -u
          sha() { sha256sum "$1" | cut -d' ' -f1; }
          refute() { if "$@" >/dev/null 2>&1; then echo "FAIL(unexpectedly succeeded): $*"; exit 1; fi; }
          expectrc() { local want=$1 rc=0; shift; "$@" >/dev/null 2>&1 || rc=$?; [ "$rc" -eq "$want" ] || { echo "FAIL($rc!=$want): $*"; exit 1; }; }
          sudo /bin/bash -c "$(cat helper/pinroutes-helper-install)" pinroutes-approve --approve 10.0.0.0/24 10.0.0.1
          A=/etc/pinroutes/routes.allow; J=/etc/pinroutes/.pinroutes-txn; JD=$J.committed
          H=/usr/local/bin/pinroutes-helper; AP=/usr/local/bin/pinroutes-approve; S=/etc/sudoers.d/pinroutes
          bogus=1111111111111111111111111111111111111111111111111111111111111111
          bak() { echo "$(dirname "$1")/.$(basename "$1").pinroutes-prev.$2"; }
          iline() { local h; h=$(sudo sha256sum "$1" | cut -d" " -f1); printf '%s|%s|%s|%s\n' "$1" "$(bak "$1" zz)" "$h" "$h"; }
          # (1) full journal; allow clobbered with real backup, unmatchable
          # new digest -> VERIFIED-RESTORE branch, others identity no-ops
          sudo cp -a "$A" "$(bak "$A" 11)"
          old=$(sha "$A")
          printf '# managed-by: pinroutes\nNEWCONTENT\n' | sudo tee "$A" >/dev/null
          { printf '%s|%s|%s|%s\n' "$A" "$(bak "$A" 11)" "$old" "$bogus"
            iline "$H"; iline "$AP"; iline "$S"; } | sudo tee "$J" >/dev/null
          sudo /usr/local/bin/pinroutes-approve --approve 10.3.0.0/24 10.3.0.1 2>&1 | grep -qi recover
          grep -q 10.3.0.0 "$A"
          sudo test ! -e "$J"
          # (1b) consumed-backup acceptance: recorded backup absent, target
          # already old -> restore branch succeeds
          old=$(sha "$A")
          { printf '%s|%s|%s|%s\n' "$A" "$(bak "$A" gone)" "$old" "$bogus"
            iline "$H"; iline "$AP"; iline "$S"; } | sudo tee "$J" >/dev/null
          sudo /usr/local/bin/pinroutes-approve --approve 10.3.5.0/24 10.3.5.1 2>&1 | grep -qi recover
          grep -q 10.3.5.0 "$A"
          sudo test ! -e "$J"
          # (2) committed marker + stale backup + all targets NEW -> commit-finish
          sudo cp -a "$A" "$(bak "$A" 12)"
          printf '# managed-by: pinroutes\nOLD\n' | sudo tee "$(bak "$A" 12)" >/dev/null
          { printf '%s|%s|%s|%s\n' "$A" "$(bak "$A" 12)" "$(sha "$(bak "$A" 12)")" "$(sha "$A")"
            iline "$H"; iline "$AP"; iline "$S"; } | sudo tee "$JD" >/dev/null
          sudo /usr/local/bin/pinroutes-approve --approve 10.4.0.0/24 10.4.0.1 2>&1 | grep -qi recover
          sudo test ! -e "$JD"
          refute sudo test -e "$(bak "$A" 12)"
          # (3) mixed unprovable -> refuse, retain journal + backup
          sudo cp -a "$A" "$(bak "$A" 13)"
          { printf '%s|%s|%s|%s\n' "$A" "$(bak "$A" 13)" "$(sha "$A")" "$bogus"
            printf '%s|%s|%s|%s\n' "$H" "$(bak "$H" 13)" "$bogus" "$(sudo sha256sum "$H" | cut -d" " -f1)"
            iline "$AP"; iline "$S"; } | sudo tee "$J" >/dev/null
          expectrc 2 sudo /usr/local/bin/pinroutes-approve --approve 10.5.0.0/24 10.5.0.1
          sudo test -e "$J"; sudo test -e "$(bak "$A" 13)"
          # (3b) uninstall under pending recovery revokes only the grant
          expectrc 2 sudo /usr/local/bin/pinroutes-approve --uninstall
          test ! -e "$S"; sudo test -e "$J"; test -x "$H"
          sudo rm "$J" "$(bak "$A" 13)"
          # Re-approve to restore the grant for the malformed-journal cases
          sudo /usr/local/bin/pinroutes-approve --approve 10.5.0.0/24 10.5.0.1
          # (4) malformed/partial journals: every case refuses and retains
          craft_refuse() { # craft_refuse <journal-content-via-stdin>
            sudo tee "$J" >/dev/null
            expectrc 2 sudo /usr/local/bin/pinroutes-approve --approve 10.6.0.0/24 10.6.0.1
            sudo test -e "$J" || { echo "FAIL: journal discarded"; exit 1; }
            sudo rm "$J"
          }
          { iline "$H"; iline "$AP"; iline "$S"; } | craft_refuse                 # missing target
          { iline "$H"; iline "$H"; iline "$AP"; iline "$S"; } | craft_refuse    # duplicate target
          { printf '%s|-|%s|%s\n' "$A" "$bogus" "$bogus"; iline "$H"; iline "$AP"; iline "$S"; } | craft_refuse  # "-" backup with digest
          { printf '%s|%s\n' "$A" "$(bak "$A" zz)"; iline "$H"; iline "$AP"; iline "$S"; } | craft_refuse        # legacy 2-field line
          { printf '/etc/shadow|%s|%s|%s\n' "$(bak "$A" zz)" "$bogus" "$bogus"; iline "$H"; iline "$AP"; iline "$S"; } | craft_refuse  # foreign target
          { printf '%s|%s|%s|%s|\n' "$A" "$(bak "$A" zz)" "$bogus" "$bogus"; iline "$H"; iline "$AP"; iline "$S"; } | craft_refuse      # trailing separator
          { printf '%s|%s/../evil|%s|%s\n' "$A" "$(bak "$A" zz)" "$bogus" "$bogus"; iline "$H"; iline "$AP"; iline "$S"; } | craft_refuse # traversal backup
          { printf '%s|/etc/pinroutes/.wrongname.5|%s|%s\n' "$A" "$bogus" "$bogus"; iline "$H"; iline "$AP"; iline "$S"; } | craft_refuse # non-canonical backup
          # (5) revoke-removal failure on update: nothing mutated, old state
          # (including the grant) fully intact
          sudo mount --bind "$S" "$S"
          expectrc 2 sudo /usr/local/bin/pinroutes-approve --approve 10.7.0.0/24 10.7.0.1
          sudo umount "$S"
          sudo test -e "$S"; refute grep -q 10.7.0.0 "$A"
          sudo visudo -cf "$S"
          # (6) second recovery with the grant path ALREADY ABSENT (a prior
          # revoke whose barrier failed): unconditional barrier, restores,
          # re-grant last, then proceeds
          sudo /usr/local/bin/pinroutes-approve --approve 10.8.0.0/24 10.8.0.1
          sudo cp -a "$S" "$(bak "$S" 41)"; sold=$(sudo sha256sum "$S" | cut -d" " -f1)
          sudo cp -a "$A" "$(bak "$A" 41)"; aold=$(sha "$A")
          printf '# managed-by: pinroutes\nX\n' | sudo tee "$A" >/dev/null
          { printf '%s|%s|%s|%s\n' "$A" "$(bak "$A" 41)" "$aold" "$bogus"
            printf '%s|%s|%s|%s\n' "$S" "$(bak "$S" 41)" "$sold" "$bogus"
            iline "$H"; iline "$AP"; } | sudo tee "$J" >/dev/null
          sudo rm "$S"
          sudo /usr/local/bin/pinroutes-approve --approve 10.8.5.0/24 10.8.5.1 2>&1 | grep -qi recover
          sudo grep -q NOSETENV "$S"; grep -q 10.8.5.0 "$A"; sudo test ! -e "$J"
          # (7) normal uninstall with the grant path already absent still
          # runs the unconditional revocation barrier, then removes the rest
          sudo rm "$S"
          sudo /usr/local/bin/pinroutes-approve --uninstall
          test ! -e "$H"; test ! -e "$AP"; test ! -e /etc/pinroutes/routes.allow
          echo "recovery matrix OK"
