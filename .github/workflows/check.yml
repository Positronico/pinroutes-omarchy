name: check
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Shell syntax
        run: |
          bash -n helper/pinroutes-helper
          bash -n helper/pinroutes-helper-install

      - name: Python syntax
        run: python3 -m py_compile stateio.py

      - name: Privileged components carry their own whole-invocation deadline
        run: |
          grep -Eq '^ *exec timeout -k 5 60 "\$0"' helper/pinroutes-helper
          grep -Eq '^ *exec timeout -k 5 60 "\$0"' helper/pinroutes-helper-install

      - name: Embedded helper matches helper/pinroutes-helper
        run: |
          sed -n '/^cat >"\$helper_tmp" <<.EMBEDDED_HELPER.$/,/^EMBEDDED_HELPER$/p' \
            helper/pinroutes-helper-install | sed '1d;$d' \
            | diff - helper/pinroutes-helper

      - name: Manifest is valid JSON with required fields
        run: |
          jq -e '.schemaVersion == 1 and .id == "pinroutes" and (.version | type) == "string"
                 and (.kinds | length) > 0 and (.entryPoints | type) == "object"' manifest.json

      - name: State I/O hardening
        run: |
          set -u
          # NB: a bare `! cmd` mid-step asserts nothing under bash -e
          # (errexit exempts !-pipelines); refute() fails the step for real.
          refute() { if "$@" >/dev/null 2>&1; then echo "FAIL(unexpectedly succeeded): $*"; exit 1; fi; }
          S=$PWD/stateio.py
          cd "$(mktemp -d)"
          mkdir -p cfg
          echo '{"ok":true}' | python3 "$S" write cfg/state.json
          [ "$(python3 "$S" read cfg/state.json)" = '{"ok":true}' ]
          ln -s /etc/hostname cfg/link.json
          refute python3 "$S" read cfg/link.json
          mkfifo cfg/fifo.json
          timeout 3 python3 "$S" read cfg/fifo.json 2>/dev/null && exit 1 || [ $? -ne 124 ]
          touch cfg/a.json && ln cfg/a.json cfg/hard.json
          refute python3 "$S" read cfg/hard.json
          head -c 1048577 /dev/zero | python3 "$S" write cfg/state.json 2>/dev/null && exit 1
          [ "$(python3 "$S" read cfg/state.json)" = '{"ok":true}' ]  # over-limit write left old content intact
          head -c 1048577 /dev/zero > cfg/big.json
          refute python3 "$S" read cfg/big.json  # oversized file refused, not truncated
          echo "stateio OK"

      - name: Bootstrap, allowlist enforcement, fixed-component re-approve
        # Denial paths only ever run — they are refused before ip(8)
        # executes, so the runner's routing table is never touched.
        run: |
          set -u
          expect() { # expect <code> <cmd...>
            local want=$1 rc=0; shift
            "$@" 2>/dev/null || rc=$?
            [ "$rc" -eq "$want" ] || { echo "FAIL($rc!=$want): $*"; exit 1; }
          }
          # `! cmd` mid-step asserts nothing under bash -e; refute() does.
          refute() { if "$@" >/dev/null 2>&1; then echo "FAIL(unexpectedly succeeded): $*"; exit 1; fi; }
          bootstrap() { sudo /bin/bash -c "$(cat helper/pinroutes-helper-install)" pinroutes-approve "$@"; }
          # Direct root execution of the (user-owned) checkout file is refused
          expect 2 sudo ./helper/pinroutes-helper-install --approve 10.0.0.0/24 10.0.0.1
          # Refusal: a foreign file at a managed path must block install
          echo junk | sudo tee /usr/local/bin/pinroutes-helper >/dev/null
          expect 2 bootstrap --approve 10.0.0.0/24 10.0.0.1
          expect 2 bootstrap --uninstall
          sudo rm /usr/local/bin/pinroutes-helper
          # Bootstrap exactly as documented: the user's shell captures the
          # script text; root receives only memory, never the checkout path.
          bootstrap --approve 10.0.0.0/24 10.0.0.1
          test -x /usr/local/bin/pinroutes-helper
          test -x /usr/local/bin/pinroutes-approve
          diff /usr/local/bin/pinroutes-approve helper/pinroutes-helper-install
          grep -qxF '10.0.0.0/24 10.0.0.1' /etc/pinroutes/routes.allow
          sudo grep -q 'secure_path' /etc/sudoers.d/pinroutes
          sudo grep -q 'managed-by: pinroutes' /etc/sudoers.d/pinroutes
          sudo grep -Eq '^#[0-9]+ ALL=\(root\) NOPASSWD:' /etc/sudoers.d/pinroutes
          sudo visudo -cf /etc/sudoers.d/pinroutes
          sudo test ! -e /etc/pinroutes/.pinroutes-txn  # journal committed away
          # No staging leftovers
          refute ls /usr/local/bin/.pinroutes-stage.*
          # Self-installed approver is runnable and re-approves on its own
          # (update-in-place exercises the backup/publish path)
          sudo /usr/local/bin/pinroutes-approve --approve 10.9.0.0/24 10.9.0.1
          grep -qxF '10.9.0.0/24 10.9.0.1' /etc/pinroutes/routes.allow
          refute grep -q '10.0.0.0/24' /etc/pinroutes/routes.allow
          for d in /usr/local/bin /etc/pinroutes /etc/sudoers.d; do
            refute ls "$d"/.*.pinroutes-prev.*
            refute ls "$d"/.pinroutes-stage.*
          done
          # Enforcement: unapproved routes denied before ip runs
          h=/usr/local/bin/pinroutes-helper
          expect 3 sudo "$h" replace 0.0.0.0/0 9.9.9.9
          expect 3 sudo "$h" replace 0.0.0.0/1 9.9.9.9
          expect 3 sudo "$h" replace 10.9.0.0/24 6.6.6.6
          expect 3 sudo "$h" delete 192.168.0.0/16 1.2.3.4
          expect 3 sudo "$h" delete 10.9.0.0/24 6.6.6.6  # approved net, wrong gateway
          # sudo path without allowlist fails closed
          sudo rm /etc/pinroutes/routes.allow
          expect 3 sudo "$h" replace 10.9.0.0/24 10.9.0.1
          # syntax validation independent of policy
          expect 2 sudo "$h" replace "10.0.0.0/16;x" 10.0.0.1
          # uninstall removes everything
          sudo /usr/local/bin/pinroutes-approve --uninstall
          test ! -e /usr/local/bin/pinroutes-helper
          test ! -e /usr/local/bin/pinroutes-approve
          test ! -e /etc/sudoers.d/pinroutes
          echo "privileged flow OK"

      - name: Digest-verified crash recovery matrix
        # Simulates every persistence outcome a failed commit-durability sync
        # can leave behind (resurrected journal / committed marker / partially
        # persisted backup deletions) by crafting the exact on-disk states and
        # verifying recovery proves all-old, all-new, or refuses.
        run: |
          set -u
          sha() { sha256sum "$1" | cut -d' ' -f1; }
          refute() { if "$@" >/dev/null 2>&1; then echo "FAIL(unexpectedly succeeded): $*"; exit 1; fi; }
          sudo /bin/bash -c "$(cat helper/pinroutes-helper-install)" pinroutes-approve --approve 10.0.0.0/24 10.0.0.1
          A=/etc/pinroutes/routes.allow; J=/etc/pinroutes/.pinroutes-txn; JD=$J.committed
          H=/usr/local/bin/pinroutes-helper
          bogus=1111111111111111111111111111111111111111111111111111111111111111
          # (1) uncommitted journal, target clobbered, backup present -> the
          # VERIFIED-RESTORE branch (recorded new_sha deliberately does not
          # match the clobbered content, so commit-finish is unreachable)
          sudo cp -a "$A" /etc/pinroutes/.routes.allow.pinroutes-prev.11
          old=$(sha "$A")
          printf '# managed-by: pinroutes\nNEWCONTENT\n' | sudo tee "$A" >/dev/null
          printf '%s\n' "$A|/etc/pinroutes/.routes.allow.pinroutes-prev.11|$old|$bogus" | sudo tee "$J" >/dev/null
          sudo /usr/local/bin/pinroutes-approve --approve 10.3.0.0/24 10.3.0.1 2>&1 | grep -qi recover
          grep -q 10.3.0.0 "$A"
          sudo test ! -e "$J"
          # (1b) consumed-backup acceptance: backup path recorded but absent,
          # target already holds the old content -> restore branch succeeds
          old=$(sha "$A")
          printf '%s\n' "$A|/etc/pinroutes/.routes.allow.pinroutes-prev.gone|$old|$bogus" | sudo tee "$J" >/dev/null
          sudo /usr/local/bin/pinroutes-approve --approve 10.3.5.0/24 10.3.5.1 2>&1 | grep -qi recover
          grep -q 10.3.5.0 "$A"
          sudo test ! -e "$J"
          # (2) committed marker + stale backup + target NEW -> commit-finish releases both
          sudo cp -a "$A" /etc/pinroutes/.routes.allow.pinroutes-prev.12
          printf '# managed-by: pinroutes\nOLD\n' | sudo tee /etc/pinroutes/.routes.allow.pinroutes-prev.12 >/dev/null
          printf '%s\n' "$A|/etc/pinroutes/.routes.allow.pinroutes-prev.12|$(sha /etc/pinroutes/.routes.allow.pinroutes-prev.12)|$(sha "$A")" | sudo tee "$JD" >/dev/null
          sudo /usr/local/bin/pinroutes-approve --approve 10.4.0.0/24 10.4.0.1 2>&1 | grep -qi recover
          sudo test ! -e "$JD"
          refute sudo test -e /etc/pinroutes/.routes.allow.pinroutes-prev.12
          # (3) mixed unprovable (one entry OLD-restorable, one NEW with vanished backup) -> refuse, retain
          sudo cp -a "$A" /etc/pinroutes/.routes.allow.pinroutes-prev.13
          printf '%s\n' \
            "$A|/etc/pinroutes/.routes.allow.pinroutes-prev.13|$(sha "$A")|$bogus" \
            "$H|/usr/local/bin/.pinroutes-helper.pinroutes-prev.13|$bogus|$(sha "$H")" | sudo tee "$J" >/dev/null
          rc=0; sudo /usr/local/bin/pinroutes-approve --approve 10.5.0.0/24 10.5.0.1 2>/dev/null || rc=$?
          [ "$rc" -eq 2 ]
          sudo test -e "$J"
          sudo test -e /etc/pinroutes/.routes.allow.pinroutes-prev.13
          # (3b) uninstall under pending recovery revokes only the grant, keeps recovery data
          rc=0; sudo /usr/local/bin/pinroutes-approve --uninstall 2>/dev/null || rc=$?
          [ "$rc" -eq 2 ]
          test ! -e /etc/sudoers.d/pinroutes
          sudo test -e "$J"
          test -x "$H"
          # manual resolution then full uninstall
          sudo mv /etc/pinroutes/.routes.allow.pinroutes-prev.13 "$A"
          sudo rm "$J"
          sudo /usr/local/bin/pinroutes-approve --uninstall
          echo "recovery matrix OK"
