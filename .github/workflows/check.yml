name: check
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          bash -n helper/pinroutes-helper
          bash -n helper/pinroutes-helper-install

      - name: Python syntax
        run: python3 -m py_compile stateio.py

      - name: Embedded helper matches helper/pinroutes-helper
        run: |
          sed -n '/^cat >"\$helper_tmp" <<.EMBEDDED_HELPER.$/,/^EMBEDDED_HELPER$/p' \
            helper/pinroutes-helper-install | sed '1d;$d' \
            | diff - helper/pinroutes-helper

      - name: Manifest is valid JSON with required fields
        run: |
          jq -e '.schemaVersion == 1 and .id == "pinroutes" and (.version | type) == "string"
                 and (.kinds | length) > 0 and (.entryPoints | type) == "object"' manifest.json

      - name: Helper allowlist enforcement
        # Only denial paths run here — they are refused before ip(8) executes,
        # so the runner's routing table is never touched.
        run: |
          set -u
          h=./helper/pinroutes-helper
          sudo mkdir -p /etc/pinroutes
          printf '10.0.0.0/24 10.0.0.1\n' | sudo tee /etc/pinroutes/routes.allow >/dev/null
          expect() { # expect <code> <args...>
            local want=$1 rc=0; shift
            sudo "$h" "$@" 2>/dev/null || rc=$?
            [ "$rc" -eq "$want" ] || { echo "FAIL: $* -> $rc (want $want)"; exit 1; }
          }
          # unapproved routes must be denied (exit 3) before ip runs
          expect 3 replace 0.0.0.0/0 9.9.9.9
          expect 3 replace 0.0.0.0/1 9.9.9.9
          expect 3 replace 10.0.0.0/24 6.6.6.6
          expect 3 delete 192.168.0.0/16
          # sudo path without allowlist must fail closed
          sudo rm /etc/pinroutes/routes.allow
          expect 3 replace 10.0.0.0/24 10.0.0.1
          # syntax validation independent of policy
          expect 2 replace "10.0.0.0/16;x" 10.0.0.1
          echo "enforcement OK"
